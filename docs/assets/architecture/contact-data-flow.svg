<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">Contact data flow</title><desc id="d">Read and write operations from React Router through data helpers to localForage and browser storage.</desc><defs><style>.h{font:700 30px Arial;fill:#172554}.s{font:600 20px Arial;fill:#14532d}.p{font:16px Arial;fill:#334155}.n{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}.a{stroke:#475569;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#475569"/></marker></defs>
<rect width="1200" height="470" rx="24" fill="#f8fafc"/><text x="55" y="65" class="h">Contact Data Flow</text><rect x="55" y="155" width="220" height="110" rx="16" class="n"/><text x="165" y="195" class="s" text-anchor="middle">Route loader</text><text x="165" y="230" class="p" text-anchor="middle">or action</text><rect x="365" y="155" width="220" height="110" rx="16" class="n"/><text x="475" y="195" class="s" text-anchor="middle">contacts.js</text><text x="475" y="230" class="p" text-anchor="middle">CRUD / search / sort</text><rect x="675" y="155" width="220" height="110" rx="16" class="n"/><text x="785" y="195" class="s" text-anchor="middle">localForage</text><text x="785" y="230" class="p" text-anchor="middle">getItem / setItem</text><rect x="985" y="155" width="160" height="110" rx="16" class="n"/><text x="1065" y="195" class="s" text-anchor="middle">Browser</text><text x="1065" y="230" class="p" text-anchor="middle">contacts key</text><path d="M275 210H365M585 210H675M895 210H985" class="a"/><text x="55" y="335" class="p">Read: load collection → match first/last name → sort → return route data.</text><text x="55" y="375" class="p">Write: read collection → mutate record → persist collection → redirect/rerender.</text><text x="55" y="415" class="p">Data remains local to the browser origin/profile. No remote sync is shown.</text></svg>
