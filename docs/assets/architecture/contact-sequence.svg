<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Contact update sequence</title><desc id="d">User submits an edit form, React Router action calls updateContact, localForage persists the contacts list, then the route redirects to contact detail.</desc><defs><style>.h{font:700 30px Arial;fill:#172554}.s{font:600 18px Arial;fill:#1e3a8a}.p{font:15px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:2;stroke-dasharray:7 7}.m{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="#f8fafc"/><text x="50" y="55" class="h">Contact Update · Sequence</text><g><rect x="50" y="95" width="180" height="55" rx="12" fill="#dbeafe"/><text x="140" y="130" class="s" text-anchor="middle">User / Form</text><path d="M140 150V445" class="l"/><rect x="340" y="95" width="180" height="55" rx="12" fill="#ede9fe"/><text x="430" y="130" class="s" text-anchor="middle">Router action</text><path d="M430 150V445" class="l"/><rect x="630" y="95" width="180" height="55" rx="12" fill="#dcfce7"/><text x="720" y="130" class="s" text-anchor="middle">updateContact</text><path d="M720 150V445" class="l"/><rect x="920" y="95" width="220" height="55" rx="12" fill="#dcfce7"/><text x="1030" y="130" class="s" text-anchor="middle">localForage</text><path d="M1030 150V445" class="l"/></g><path d="M140 195H430" class="m"/><text x="285" y="185" class="p" text-anchor="middle">FormData</text><path d="M430 260H720" class="m"/><text x="575" y="250" class="p" text-anchor="middle">id + updates</text><path d="M720 325H1030" class="m"/><text x="875" y="315" class="p" text-anchor="middle">getItem("contacts")</text><path d="M1030 370H720" class="m"/><text x="875" y="360" class="p" text-anchor="middle">collection</text><path d="M720 415H1030" class="m"/><text x="875" y="405" class="p" text-anchor="middle">setItem("contacts")</text><text x="50" y="485" class="p">After persistence, the action redirects to /contacts/:contactId.</text></svg>
