name: "📚 Documentation issue"
description: Report inaccurate, missing, unclear, or broken documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Documentation page
      description: Provide the repository path or URL.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Incorrect technical information
        - Missing documentation
        - Broken link
        - Unclear instructions
        - Outdated screenshot or diagram
        - Accessibility/readability problem
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What needs to change?
      description: Explain the problem and expected correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link source code, workflow runs, or safe screenshots.
