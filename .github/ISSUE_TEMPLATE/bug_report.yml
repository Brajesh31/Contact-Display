name: "🐛 Bug report"
description: Report a reproducible problem in Contact Display.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic contact records only. Remove names, phone numbers, notes, browser-storage exports, and other personal information from all screenshots and logs.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What is wrong, and which route or workflow is affected?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide ordered, minimal steps with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: input
    id: commit
    attributes:
      label: Commit or application version
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Link sanitized logs or screenshots. Never attach private contact records.
