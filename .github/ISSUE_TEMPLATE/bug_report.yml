name: "🐛 Bug report"
description: Report a reproducible problem in Contact Display.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove personal contact information from every example, log, and screenshot."
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide ordered, minimal steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove names, phone numbers, notes, tokens, and private contact details.
