name: 📚 Documentation validation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate documentation assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate documentation files
        run: python scripts/validate_docs.py
      - name: Validate internal links
        run: python scripts/validate_links.py
      - name: Validate SVG assets
        run: python scripts/validate_svg.py
